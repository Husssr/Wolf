<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1216">
<title>Werewolf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1216'/%3E%3Ccircle cx='16' cy='16' r='12.5' fill='%23bcd6e2' opacity='.35'/%3E%3Cpath d='M4 4l7 7h10l7-7v14c0 6.5-5.5 10-12 10S4 24.500 4 18z' fill='%23ece6d3'/%3E%3Cpath d='M9 17l5 2.500M23 17l-5 2.500' stroke='%23e0613f' stroke-width='2.600' stroke-linecap='round'/%3E%3Cpath d='M13.500 23.500h5l-2.500 2.800z' fill='%230a1216'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* แนวคิด: ฉากกลางคืนในป่า พื้นเข้มอมเขียว แสงจันทร์ซีด ตัวอักษรหัวข้อหนาแบบโปสเตอร์เก่า */
:root{
  --ink:#091115; --pine:#10202a; --fog:#182c35; --line:#2a4350;
  --bone:#ece6d3; --mute:#98aca8; --moon:#bcd6e2; --ember:#e0613f; --moss:#85b890; --gold:#e3bd62;
  --display:'Chonburi','Noto Serif Thai',Georgia,serif; --body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.5}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-bottom,0px));
  background:radial-gradient(900px 600px at 85% -10%,rgba(188,214,226,.14),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(133,184,144,.09),transparent 60%),var(--ink);
  background-attachment:fixed;min-height:100vh;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px}
.narrow{max-width:520px;margin:0 auto;padding-block:18px}
.card{background:linear-gradient(180deg,rgba(24,44,53,.86),rgba(16,32,42,.86));border:1px solid var(--line);border-radius:14px;padding:18px}
.lbl{font-size:.8rem;letter-spacing:.08em;color:var(--mute);font-weight:600;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:0 22px;border-radius:12px;border:1px solid var(--line);background:var(--fog);font-weight:600;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--bone);color:#10202a;border-color:var(--bone)}
.btn.ember{background:var(--ember);border-color:var(--ember);color:#1a0b06}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:.92rem;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.block{width:100%}
.field{width:100%;min-height:54px;border-radius:12px;border:1px solid var(--line);background:rgba(9,17,21,.7);color:var(--bone);padding:0 16px;font-size:1.1rem;user-select:text;-webkit-user-select:text}
.field:focus,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.code{font-family:var(--display);font-size:clamp(3rem,9vw,5.5rem);letter-spacing:.14em;line-height:1;color:var(--bone)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:14px}
.muted{color:var(--mute)}
.err{color:#ffb4a0;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(9,17,21,.55);font-size:.9rem;font-weight:600}
.chip.wolf{border-color:var(--ember);color:#ffb7a3}
.chip.ok{border-color:var(--moss);color:var(--moss)}
svg.ic{width:1.4em;height:1.4em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ลานเข้าเกม */
.hero{text-align:center;padding-top:6vh}
.hero h1{font-size:clamp(2.6rem,9vw,4.6rem);line-height:1.1;margin-bottom:6px}
.hero p{color:var(--mute);margin:0 0 28px}
.moon{width:92px;height:92px;border-radius:50%;margin:0 auto 22px;background:radial-gradient(circle at 35% 35%,#f3f1e4,#bcd6e2 70%);box-shadow:0 0 70px rgba(188,214,226,.45)}
.forest{position:fixed;left:0;right:0;bottom:0;height:90px;opacity:.55;pointer-events:none;z-index:-1}
.divider{display:flex;align-items:center;gap:12px;color:var(--mute);margin:22px 0;font-size:.9rem}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}

/* ห้องรอ (ไอแพด) */
.lobbygrid{align-items:start;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px}
@media(max-width:860px){.lobbygrid{grid-template-columns:1fr}}
.qr{width:170px;height:170px;border-radius:10px;overflow:hidden;background:#ece6d3;display:grid;place-items:center;flex:none}
.qr svg{width:100%;height:100%;display:block}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:rgba(9,17,21,.55);border:1px solid var(--line);min-width:0}
.pl span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pl .x{background:none;border:0;color:var(--mute);padding:4px 6px;font-size:1.1rem}
.pl.dead{opacity:.45;text-decoration:line-through}
.dot{width:9px;height:9px;border-radius:50%;background:var(--moss);flex:none}
.dot.off{background:var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;min-height:46px;padding:0 12px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--bone);color:#10202a}
.tog{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(9,17,21,.4);width:100%;text-align:left}
.tog.on{border-color:var(--moss);background:rgba(133,184,144,.1)}
.tog .t{font-weight:600}.tog .d{font-size:.85rem;color:var(--mute);line-height:1.3}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bone);transition:.15s}
.tog.on .sw{background:var(--moss)}.tog.on .sw:after{left:21px;background:#10202a}
.tog[disabled]{opacity:.7;cursor:default}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--fog);font-size:1.3rem}
.step b{font-family:var(--display);font-size:1.6rem;min-width:1.6em;text-align:center}
.mix{display:flex;flex-wrap:wrap;gap:8px}

/* ฉากเกม (ไอแพด) */
.stage{min-height:calc(100vh - 36px);display:grid;grid-template-rows:auto 1fr auto;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.center{display:grid;place-items:center;text-align:center;align-content:center;gap:18px;padding:10px}
.big{font-family:var(--display);font-size:clamp(1.8rem,4.6vw,3.4rem);line-height:1.3;max-width:20ch;text-wrap:balance}
.sub{color:var(--mute);font-size:1.2rem;max-width:34ch}
.timer{font-family:var(--display);font-size:clamp(4rem,14vw,9rem);line-height:1;font-variant-numeric:tabular-nums}
.night{background:radial-gradient(900px 600px at 50% 20%,rgba(188,214,226,.1),transparent 65%)}
.pulse{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--ink);background:radial-gradient(circle at 35% 35%,#f3f1e4,#bcd6e2 75%);box-shadow:0 0 90px rgba(188,214,226,.4)}
.pulse svg{width:64px;height:64px;stroke-width:1.6}
.pulse:after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(188,214,226,.45);animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.5);opacity:0}}
.pulse.wolf{background:radial-gradient(circle at 35% 35%,#ffb7a3,#e0613f 75%);box-shadow:0 0 90px rgba(224,97,63,.5)}
.pulse.wolf:after{border-color:rgba(224,97,63,.55)}
.dawn{background:radial-gradient(900px 600px at 50% 0%,rgba(227,189,98,.18),transparent 65%)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;width:min(420px,80vw)}
.bar i{display:block;height:100%;background:var(--moss);transition:width .3s}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pt{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(9,17,21,.5);display:flex;gap:8px;align-items:center;min-width:0}
.pt.dead{opacity:.5}.pt.dead .n{text-decoration:line-through}
.pt .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pt .r{font-size:.75rem;color:var(--mute)}
.pt.pick{cursor:pointer;min-height:56px;font-size:1.1rem}
.tallyrow{display:grid;grid-template-columns:minmax(80px,160px) 1fr auto;gap:12px;align-items:center;width:min(640px,92vw);text-align:left}
.tallyrow .tb{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.tallyrow .tb i{display:block;height:100%;background:var(--ember)}
.win{font-size:clamp(2.2rem,6vw,4.4rem)}

/* มือถือผู้เล่น */
.phone{max-width:480px;margin:0 auto;min-height:calc(100vh - 20px);display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding-block:14px}
.phone.sleepy{background:#000}
.rolecard{border-radius:18px;border:1px solid var(--line);padding:26px 20px;text-align:center;display:grid;gap:12px;justify-items:center;background:linear-gradient(180deg,#14303a,#0d1c24)}
.rolecard .ic{width:76px;height:76px;stroke-width:1.4}
.rolecard h2{font-size:2.4rem}
.rolecard.wolf{background:linear-gradient(180deg,#4a1d14,#1d0c08);border-color:var(--ember)}
.rolecard.hidden{background:repeating-linear-gradient(45deg,#10202a,#10202a 10px,#14303a 10px,#14303a 20px);min-height:260px;align-content:center;color:var(--mute)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--fog);font-size:1.1rem;font-weight:600;text-align:left;width:100%}
.opt.sel{background:var(--bone);color:#10202a;border-color:var(--bone)}
.opt.bad.sel{background:var(--ember);border-color:var(--ember);color:#1a0b06}
.opt.dim{opacity:.4}
.opt small{font-weight:500;color:inherit;opacity:.75}
.sleep{display:grid;place-items:center;text-align:center;align-content:center;gap:10px;color:#2b3b40;min-height:60vh}
.sleep b{font-family:var(--display);font-size:2.2rem;font-weight:400;color:#3a4d53}
.verdict{border-radius:14px;padding:18px;text-align:center;font-family:var(--display);font-size:1.5rem;border:1px solid var(--line)}
.verdict.w{background:rgba(224,97,63,.18);border-color:var(--ember)}
.verdict.v{background:rgba(133,184,144,.15);border-color:var(--moss)}
.log{max-height:36vh;overflow:auto;font-size:.95rem;display:grid;gap:4px;color:var(--mute)}
.caption{font-size:.95rem;color:var(--mute);text-align:center;min-height:1.5em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ember);color:#1a0b06;font-weight:700;padding:12px 18px;border-radius:12px;z-index:9;max-width:90vw}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade,.pulse:after{animation:none}}

/* ===== รอบปรับปรุง: ปุ่มป้ายไม้ลายนูนทอง / ตอบสนองทุกจอ / การ์ดบทบาท ===== */
:root{--gold1:#f6dc94;--gold2:#d4a444;--gold3:#8a6a2c;--wood1:#4a3623;--wood2:#2a1d12}
[hidden]{display:none!important}
body{font-size:clamp(16px,.45vw + 14px,20px);min-height:100vh}
@supports (height:100dvh){body{min-height:100dvh}.stage{min-height:calc(100dvh - 36px)}.phone{min-height:calc(100dvh - 20px)}}
.card{border-color:rgba(201,153,63,.32);box-shadow:inset 0 1px 0 rgba(255,225,150,.08),0 10px 30px rgba(0,0,0,.35)}
.btn,.opt,.seg button,.step button,.tog,.pt.pick{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn,.opt,.seg button,.step button,.tog{position:relative;overflow:hidden}
.btn{padding:0 32px;color:var(--gold1);border:1px solid var(--gold3);border-radius:12px;
  background:repeating-linear-gradient(94deg,rgba(255,255,255,.04) 0 2px,transparent 2px 8px),linear-gradient(180deg,var(--wood1),var(--wood2));
  box-shadow:inset 0 1px 0 rgba(255,225,150,.4),inset 0 -2px 0 rgba(0,0,0,.5),0 0 0 2px #140d07,0 4px 0 #0c0704,0 8px 16px rgba(0,0,0,.45);
  text-shadow:0 1px 0 #000;letter-spacing:.02em;transition:transform .09s,box-shadow .09s,filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,225,150,.3),inset 0 -1px 0 rgba(0,0,0,.5),0 0 0 2px #140d07,0 1px 0 #0c0704,0 3px 8px rgba(0,0,0,.4)}
.btn::before,.btn::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fbe9b0,#b4862f 55%,#4a3410);box-shadow:0 1px 1px rgba(0,0,0,.7)}
.btn::before{left:12px}.btn::after{right:12px}
.btn.small{padding:0 24px}.btn.small::before{left:9px}.btn.small::after{right:9px}
.btn.primary{color:#2a1a06;text-shadow:0 1px 0 rgba(255,240,190,.55);border-color:#fbe9b0;
  background:linear-gradient(180deg,var(--gold1),var(--gold2) 58%,#a8782a);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(90,55,10,.5),0 0 0 2px #3a2810,0 4px 0 #1a1005,0 8px 18px rgba(227,189,98,.28)}
.btn.primary:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(90,55,10,.5),0 0 0 2px #3a2810,0 1px 0 #1a1005,0 3px 10px rgba(227,189,98,.25)}
.btn.primary::before,.btn.primary::after{background:radial-gradient(circle at 35% 30%,#fff3cf,#9a6e22 60%,#4a3410)}
.btn.ember{color:#ffe8dc;border-color:#ff9a7c;text-shadow:0 1px 0 #3a0f06;background:linear-gradient(180deg,#d1613f,#7e2a18);
  box-shadow:inset 0 1px 0 rgba(255,200,170,.5),inset 0 -3px 0 rgba(60,10,0,.5),0 0 0 2px #2a0d06,0 4px 0 #1a0803,0 8px 18px rgba(224,97,63,.25)}
.btn.ghost{padding:0 22px;color:var(--bone);text-shadow:none;border-color:transparent;background:rgba(9,17,21,.55);box-shadow:inset 0 0 0 1px rgba(201,153,63,.4)}
.btn.ghost::before,.btn.ghost::after{display:none}
.btn.ghost:active{transform:scale(.97);box-shadow:inset 0 0 0 1px rgba(201,153,63,.4)}
.btn[disabled]{opacity:.45;filter:saturate(.4);pointer-events:none}
.opt{color:var(--bone);border:1px solid #6a4f22;border-radius:12px;
  background:repeating-linear-gradient(94deg,rgba(255,255,255,.035) 0 2px,transparent 2px 8px),linear-gradient(180deg,#34261a,#1f160e);
  box-shadow:inset 0 1px 0 rgba(255,225,150,.25),inset 0 -2px 0 rgba(0,0,0,.45),0 3px 0 #0c0704;transition:transform .09s,box-shadow .09s,filter .15s}
.opt:hover{filter:brightness(1.12)}
.opt:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,225,150,.2),0 1px 0 #0c0704}
.opt.sel{color:#2a1a06;border-color:#fbe9b0;background:linear-gradient(180deg,var(--gold1),var(--gold2) 60%,#a8782a);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(90,55,10,.45),0 3px 0 #1a1005,0 0 20px rgba(227,189,98,.3)}
.opt.bad.sel{color:#1a0b06;border-color:#ffb7a3;background:linear-gradient(180deg,#f08a6a,#c04526);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(80,20,5,.45),0 3px 0 #2a0d06,0 0 20px rgba(224,97,63,.35)}
.seg{border-color:var(--gold3);background:rgba(20,13,7,.7);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.seg button{color:#b9a572;transition:filter .15s}
.seg button.on{color:#2a1a06;background:linear-gradient(180deg,var(--gold1),var(--gold2) 60%,#a8782a);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(90,55,10,.4)}
.seg button:active{filter:brightness(1.25)}
.step button{color:var(--gold1);border-color:var(--gold3);background:linear-gradient(180deg,var(--wood1),var(--wood2));box-shadow:inset 0 1px 0 rgba(255,225,150,.35),0 3px 0 #0c0704;transition:transform .09s,box-shadow .09s}
.step button:active{transform:translateY(2px);box-shadow:0 1px 0 #0c0704}
.tog{border-color:#4a3a22;background:linear-gradient(180deg,rgba(42,29,18,.7),rgba(20,13,7,.7));transition:transform .09s,border-color .15s,background .15s}
.tog:active{transform:scale(.985)}
.tog.on{border-color:var(--gold2);background:linear-gradient(180deg,rgba(133,184,144,.14),rgba(20,13,7,.7));box-shadow:0 0 18px rgba(227,189,98,.12)}
.pt.pick{transition:transform .09s,border-color .15s}
.pt.pick:hover{border-color:var(--gold2)}
.pt.pick:active{transform:scale(.96)}
.rip{position:fixed;z-index:60;width:130px;height:130px;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,170,.55) 0,rgba(255,236,170,.18) 45%,transparent 70%);border:1.5px solid rgba(246,220,148,.7);
  transform:translate(-50%,-50%) scale(.1);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* การ์ดบทบาท */
.pcard{--w:min(24vw,96px);width:var(--w);aspect-ratio:200/280;position:relative;perspective:900px;cursor:pointer;touch-action:none;flex:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline-offset:5px;-webkit-tap-highlight-color:transparent}
.pcard .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pcard.show .in{transform:rotateY(180deg)}
.pcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7%/5%;overflow:hidden;
  box-shadow:0 8px 22px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.6)}
.pcard .front{transform:rotateY(180deg)}
.pcard .front,.pk-card{container-type:inline-size}
.cs{display:block;width:100%;height:100%}
.cname{position:absolute;left:12%;right:12%;top:76.4%;height:12.9%;display:grid;place-items:center;text-align:center}
.cname b{font-family:var(--display);font-weight:400;font-size:18px;font-size:clamp(9px,10.5cqw,40px);color:#f3dc9a;text-shadow:0 1px 0 #000;white-space:nowrap;letter-spacing:.02em}
.csub{position:absolute;left:0;right:0;top:89.4%;text-align:center;font-size:9px;font-size:clamp(6px,5cqw,16px);color:#c9b57e;letter-spacing:.06em}
.csub.wolf{color:#ffb7a3}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;max-width:560px;margin:0 auto;
  padding:34px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,transparent,rgba(9,17,21,.94) 46%);pointer-events:none}
#dock .pcard{pointer-events:auto}

/* โต๊ะแจกไพ่ (จอผู้คุมเกม) */

}

.tablering{position:absolute;inset:7%;border-radius:50%;border:1px dashed rgba(227,189,98,.2);pointer-events:none}

.dc,.sc{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:200/280;margin:calc(var(--cw) * -.7) 0 0 calc(var(--cw) * -.5);will-change:transform,opacity;pointer-events:none}

.cardback{width:100%;height:100%;border-radius:7%/5%;overflow:hidden;background:#0c1a21;box-shadow:0 3px 9px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.7)}

@keyframes mshuf{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(-34px) rotate(-9deg)}60%{transform:translateX(34px) rotate(9deg)}}

.tw{animation:twk 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

.shine{position:absolute;inset:0;border-radius:7%/5%;pointer-events:none;mix-blend-mode:screen;opacity:.9;
  background:linear-gradient(115deg,transparent 38%,rgba(255,244,200,.34) 48%,rgba(255,255,255,.12) 54%,transparent 62%);background-size:260% 100%;background-position:130% 0;animation:shineMove 4.2s ease-in-out infinite}

@keyframes cardglow{0%,100%{box-shadow:0 0 50px rgba(227,189,98,.28),0 14px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 90px rgba(227,189,98,.55),0 14px 40px rgba(0,0,0,.7)}}

@media(prefers-reduced-motion:reduce){.tw,.wglow,.shine{animation:none}#peek .pk-card{animation:none}}

/* ปุ่มโหวตชื่อผู้เล่น */
.vbtn{justify-content:flex-start;gap:12px;min-height:60px}
.vbtn .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--display);font-size:1.05rem;color:var(--gold1);
  background:radial-gradient(circle at 35% 30%,#5a4630,#1c130b);border:1px solid var(--gold3);box-shadow:inset 0 1px 0 rgba(255,225,150,.35);transition:.2s}
.vbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn>svg.ic{width:1.5em;height:1.5em;stroke-width:2.6;opacity:0;transform:scale(.3) rotate(-20deg);transition:.25s cubic-bezier(.2,1.5,.4,1)}
.vbtn.sel>svg.ic{opacity:1;transform:none}
.vbtn.sel .av{background:radial-gradient(circle at 35% 30%,#6a1e0e,#2a0d06);border-color:#ffd0bd;color:#ffe8dc}
.vbtn.sel{animation:voteglow 2.2s ease-in-out infinite}

.vbtn.pop{animation:votepop .5s cubic-bezier(.2,1.4,.4,1),voteglow 2.2s ease-in-out .5s infinite}
.vbtn.pop:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 50%,rgba(255,230,200,.85),transparent 55%);animation:voteflash .7s ease-out forwards}
@keyframes votepop{0%{transform:scale(.93)}55%{transform:scale(1.045)}100%{transform:scale(1)}}

.votemine{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--mute);font-weight:600;text-align:center}

  background:radial-gradient(130% 160% at 50% 0%,rgba(188,214,226,.2),rgba(18,30,36,.92));box-shadow:inset 0 0 22px rgba(188,214,226,.1),0 3px 0 #06100f}

.btn.small.ghost{gap:.45em;color:#e9dcb8;border:1px solid rgba(201,153,63,.55);border-radius:12px;
  background:linear-gradient(180deg,rgba(74,54,35,.55),rgba(20,13,7,.8));box-shadow:inset 0 1px 0 rgba(255,225,150,.28),inset 0 -2px 0 rgba(0,0,0,.4),0 3px 0 #0c0704,0 6px 12px rgba(0,0,0,.35);text-shadow:0 1px 0 #000}

.btn.small:not(.ghost){background:linear-gradient(180deg,#6a4c2e,#2a1d12)}

.btn.tt.danger:not(.ask){color:#ffc9b8;border-color:rgba(224,97,63,.6)}
@keyframes askpulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,200,170,.4),0 3px 0 #2a0d06,0 0 8px rgba(224,97,63,.35)}50%{box-shadow:inset 0 1px 0 rgba(255,200,170,.4),0 3px 0 #2a0d06,0 0 22px rgba(224,97,63,.8)}}

.seg button{position:relative;overflow:hidden}
.btn:focus-visible,.seg button:focus-visible,.step button:focus-visible,.tog:focus-visible{outline:2px solid var(--gold1);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.btn.tt.ask{animation:none}}

function speak(text, done) {

function fillPeek() { peekEl.querySelector('.pk-card').innerHTML = cardFace(V.me.role); peekEl.querySelector('.pk-info').innerHTML = infoHtml(); }
function setPeek(v) {
  if (v === peek) return; if (v && !(V && V.me && V.me.role)) return;
  peek = v; pcard.classList.toggle('show', v); peekEl.hidden = !v; if (v) fillPeek();
}
function hideDock() { setPeek(false); dockEl.hidden = true; document.body.classList.remove('hasdock', 'dockbig', 'sleepy'); dockRole = null; }
function updateDock() {
  const vis = V && V.who === 'player' && V.me && V.me.role && V.phase !== 'lobby' && V.phase !== 'ended' && V.phase !== 'reveal';
  if (!vis) return hideDock();
  if (dockRole !== V.me.role) { dockRole = V.me.role; pcard.querySelector('.front').innerHTML = cardFace(dockRole); }
  dockEl.hidden = false; document.body.classList.add('hasdock'); document.body.classList.toggle('dockbig', V.phase === 'reveal');
  if (peek) fillPeek();
}
pcard.addEventListener('pointerdown', e => { e.preventDefault(); try { pcard.setPointerCapture(e.pointerId); } catch (_) {} setPeek(true); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => pcard.addEventListener(ev, () => setPeek(false)));
window.addEventListener('blur', () => setPeek(false));
pcard.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setPeek(true); } });
pcard.addEventListener('keyup', () => setPeek(false));
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#pcard')) e.preventDefault(); });

/* ───────── เริ่มต้น ───────── */
(function boot() {
  const h = LS.get('ww_host'), p = LS.get('ww_player'), c = new URLSearchParams(location.search).get('c');
  if (h && !c) { mode = 'host'; $app.innerHTML = '<div class="narrow hero"><div class="logo load">' + LOGO + '</div><p>กำลังกลับเข้าห้อง…</p></div>'; connect(); setTimeout(() => { if (!V) { mode = null; renderLanding(); } }, 6000); }
  else if (p && !c) { mode = 'player'; $app.innerHTML = '<div class="narrow hero"><div class="logo load">' + LOGO + '</div><p>กำลังกลับเข้าห้อง…</p></div>'; connect(); setTimeout(() => { if (!V) { mode = null; renderLanding(); } }, 6000); }
  else renderLanding();
})();
})();
</script>
